# TP-Link ATP — docker-compose (bridge mode, macOS / Windows)
#
# Used merged with base file (execute in the same directory containing docker-compose.yml):
#   docker compose -f docker-compose.yml -f docker-compose.bridge.yml up --build -d
#
# Under bridge mode containers no longer use host network stack (network_mode: bridge overrides base file's host):
#   - Web UI accessed via port mapping: http://localhost:5000
#   - extra_hosts resolves host.docker.internal to host gateway (host-gateway), making it easy for container to access services running on host
#   - Accessing router (default 192.168.1.1) depends on Docker Desktop LAN routing, please ensure host can ping router first
#   - ATP_LAN_IFACE / ATP_WIFI_IFACE / ATP_EXT_NIC_IP usually not applicable on macOS / Windows,
#     keep default values; gateway IP and login credentials suggested to leave env vars empty, configure and save via Web UI
#
# HEALTHCHECK inherits docker-compose.yml: container curls http://127.0.0.1:5000/ (under bridge mode
# 127.0.0.1 inside container can still reach container's own Flask port).

services:
  atp-web:
    network_mode: bridge
    ports:
      # Host accesses Flask inside container: http://localhost:5000
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
