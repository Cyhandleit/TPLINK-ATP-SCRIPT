# TP-Link ATP — docker-compose
#
# Single service:
#   atp-web : Flask Web UI (configuration, dashboard, per-case/stage run), host connects directly to http://localhost:5000
#             All test stages (stage 1~5 and all) can be run via Web UI, no separate atp-engine container needed.
#
# Important: Playwright inside container needs to control browser to access LAN router (default 192.168.1.1).
# This file defaults to network_mode: host, suitable for Linux host, can directly reach LAN devices.
# On macOS / Windows, containers under bridge network cannot directly reach physical LAN by default, please use bridge and ensure
# router IP reachable (or route via host.docker.internal after pre-building browser).

services:
  atp-web:
    build: .
    container_name: atp-web
    network_mode: host
    environment:
      - ATP_GATEWAY_IP=${ATP_GATEWAY_IP:-192.168.1.1}
      - ATP_GATEWAY_SCHEME=${ATP_GATEWAY_SCHEME:-http}
      - ATP_ADMIN_USER=${ATP_ADMIN_USER:-admin}
      - ATP_ADMIN_PASS=${ATP_ADMIN_PASS}
      - ATP_SUPERADMIN_USER=${ATP_SUPERADMIN_USER:-superadmin}
      - ATP_SUPERADMIN_PASS=${ATP_SUPERADMIN_PASS}
      - ATP_LAN_IFACE=${ATP_LAN_IFACE:-eth0}
      - ATP_WIFI_IFACE=${ATP_WIFI_IFACE:-wlan0}
      - ATP_EXT_NIC_IP=${ATP_EXT_NIC_IP}
      - ATP_PING_SECONDS=${ATP_PING_SECONDS:-300}
      - ATP_RUN_DESTRUCTIVE=${ATP_RUN_DESTRUCTIVE:-false}
      - ATP_HEADED=${ATP_HEADED:-false}
      - ATP_DEBUG=${ATP_DEBUG:-0}
      - PYTHONUNBUFFERED=1
    volumes:
      # Test reports and screenshots persisted to host
      - ./reports:/app/reports
      # config.json is handled by entrypoint.sh: copied from config.json.example if missing,
      # and writable inside container so save_config() can persist user input.
      # Do NOT mount host config.json here: if host file is missing, Docker creates a
      # directory at the mount point causing IsADirectoryError; if mounted ro, save_config
      # cannot write. Use docker cp or bind-mount a single file manually if needed.
    # Flask listens on 0.0.0.0:5000; under network_mode: host host connects directly, no ports mapping needed
    # (network_mode: host and ports cannot coexist)
    healthcheck:
      # Under network_mode: host, 127.0.0.1 inside container is host 127.0.0.1, Flask has bound 5000
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
