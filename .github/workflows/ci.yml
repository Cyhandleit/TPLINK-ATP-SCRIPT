name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每日凌晨跑一次连通性冒烟测试，确保镜像可用
    - cron: "0 3 * * *"

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask requests bandit flake8

      - name: Python syntax check
        run: |
          python -m py_compile atp_engine.py
          python -m py_compile atp_web.py
          python -m py_compile atp_config.py

      - name: Run flake8
        run: |
          flake8 atp_engine.py atp_web.py atp_config.py --max-line-length=120 --extend-ignore=E203,W503

      - name: Run bandit security scan
        run: |
          bandit -r atp_engine.py atp_web.py atp_config.py -f json -o bandit-report.json || true
          bandit -r atp_engine.py atp_web.py atp_config.py

  build-and-test:
    needs: lint-and-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Build Docker image
        run: |
          docker build -t atp-project:test .

      - name: Run smoke test (stage 1, short ping)
        run: |
          docker run --rm \
            --network host \
            -e ATP_GATEWAY_IP=127.0.0.1 \
            -e ATP_ADMIN_PASS=testpass \
            -e ATP_SUPERADMIN_PASS=testpass \
            -v "$(pwd)/reports:/app/reports" \
            atp-project:test \
            python atp_engine.py --stage 1 --ping-seconds 10 || true
