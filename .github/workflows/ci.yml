name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install flask requests bandit flake8==7.5.0

      - name: Run flake8
        run: |
          flake8 atp_engine.py atp_web.py atp_config.py --max-line-length=120 --extend-ignore=E203,W503

      - name: Run bandit security scan
        run: |
          bandit -r atp_engine.py atp_web.py atp_config.py -f json -o bandit-report.json || true
          bandit -r atp_engine.py atp_web.py atp_config.py
